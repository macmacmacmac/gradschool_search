name: Daily Mech Interp Drip

on:
  schedule:
    - cron: '0 12 * * *' # Run at 12:00 UTC daily
  workflow_dispatch: # Allow manual trigger

jobs:
  send-drip:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit changes back
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # We just need the latest commit

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Daily Drip
      env:
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
      run: |
        python src/daily_drip.py

    - name: Commit database changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add papers.db
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || git commit -m "Update papers database (daily drip)"
        git push
